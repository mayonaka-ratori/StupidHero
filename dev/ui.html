<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>UIの部品</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #000; overflow: hidden;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #safe-probe { position: fixed; bottom: 0; left: 0; width: 0; height: env(safe-area-inset-bottom, 0px); pointer-events: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="safe-probe"></div>
  <script type="module" src="/src/dev/uiPreview.ts"></script>
</body>
</html>
