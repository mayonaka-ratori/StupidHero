<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Stupid Hero</title>
  <link rel="icon" href="data:,">
  <meta property="og:title" content="Stupid Hero">
  <meta property="og:description" content="敵と味方の区別がつかないヒーローに、ワルと市民を教えて街を守れ!">
  <meta property="og:image" content="./og.png">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    html, body {
      margin: 0; height: 100%; background: #000; overflow: hidden;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #safe-probe { position: fixed; bottom: 0; left: 0; width: 0; height: env(safe-area-inset-bottom, 0px); pointer-events: none; }
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 10; background: #0f0d18; color: #f5c542;
      font-family: "DotGothic16", monospace; font-size: 20px; align-items: center; justify-content: center; text-align: center;
    }
    @media (orientation: landscape) and (max-height: 540px) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="safe-probe"></div>
  <div id="rotate">スマホを縦にしてね</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
