# テストしてから組み立てて GitHub Pages に公開する。
# 作りかけの状態が公開されないように、公開は手で動かしたときだけ(Actions の画面の「Run workflow」)。
# 最初の1回だけ、リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく必要がある。
name: Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 公開する版(タグかブランチかコミット)
        required: true
        # いま公開している版(ステージ1からステージ3。コードの見直し、起動を速くする、共有用の画像の作り直しまで)
        default: 2d94ccfda1361adabcff5cf88976bff7d75a9e3a

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
